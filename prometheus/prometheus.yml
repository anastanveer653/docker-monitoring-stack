global:
  scrape_interval: 15s       # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate rules
  scrape_timeout: 10s

  external_labels:
    monitor: "docker-monitoring-stack"

# ─────────────────────────────────────────────
# Alertmanager connection
# ─────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ─────────────────────────────────────────────
# Recording & alerting rules
# ─────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/rules/*.yml"

# ─────────────────────────────────────────────
# Scrape configs
# ─────────────────────────────────────────────
scrape_configs:

  # ── Monitoring stack (self-monitoring) ──────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "blackbox-exporter"
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # ── Host metrics (Node Exporter) ────────────
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "docker-host"

  # ── Container metrics (cAdvisor) ────────────
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Drop series that are expensive and unused by the dashboards/alerts
      - source_labels: [__name__]
        regex: "container_(tasks_state|memory_failures_total|blkio_device_usage_total)"
        action: drop

  # ── Your applications ───────────────────────
  # Drop a YAML file into prometheus/targets/apps/ — picked up automatically,
  # no reload needed. See prometheus/targets/apps/example.yml.disabled
  - job_name: "apps"
    file_sd_configs:
      - files: ["/etc/prometheus/targets/apps/*.yml"]
        refresh_interval: 30s

  # ── Endpoint probing (Blackbox Exporter) ────
  # Targets live in prometheus/targets/blackbox-http.yml (auto-reloaded).
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/blackbox-http.yml"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "blackbox-tcp"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/blackbox-tcp.yml"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
