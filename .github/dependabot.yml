version: 2
updates:
  # Keeps the pinned image tags in docker-compose.yml up to date
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      monitoring-images:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
