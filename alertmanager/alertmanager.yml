# Alertmanager does NOT expand environment variables in this file.
# Secrets (webhook URLs, SMTP passwords) are read from files mounted at
# /etc/alertmanager/secrets/ — see alertmanager/secrets/README.md.

global:
  resolve_timeout: 5m

  # ── SMTP (email alerts) ──────────────────────
  # smtp_smarthost: "smtp.gmail.com:587"
  # smtp_from: "alerts@example.com"
  # smtp_auth_username: "alerts@example.com"
  # smtp_auth_password_file: /etc/alertmanager/secrets/smtp-password
  # smtp_require_tls: true

templates:
  - "/etc/alertmanager/templates/*.tmpl"

# ─────────────────────────────────────────────
# Routing tree
# ─────────────────────────────────────────────
route:
  receiver: "default"
  group_by: ["alertname", "instance"]
  group_wait: 30s          # Wait before sending the first notification for a group
  group_interval: 5m       # Wait before sending updates for a group
  repeat_interval: 12h     # Re-send interval for alerts that are still firing

  routes:
    # Heartbeat — send to a dead man's switch, never to humans
    - matchers: ['alertname = "Watchdog"']
      receiver: "watchdog"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    # Critical alerts: notify fast, repeat often
    - matchers: ['severity = "critical"']
      receiver: "critical"
      group_wait: 10s
      repeat_interval: 1h

    # Warnings: batched
    - matchers: ['severity = "warning"']
      receiver: "default"
      group_wait: 1m
      repeat_interval: 4h

# ─────────────────────────────────────────────
# Inhibition rules
# ─────────────────────────────────────────────
inhibit_rules:
  # A critical alert mutes the warning variant of the same alert
  - source_matchers: ['severity = "critical"']
    target_matchers: ['severity = "warning"']
    equal: ["alertname", "instance"]

  # If a scrape target is down, mute every other alert for that instance
  - source_matchers: ['alertname = "TargetDown"']
    target_matchers: ['alertname != "TargetDown"']
    equal: ["instance"]

  # If cAdvisor is down, every container looks "down" — mute those
  - source_matchers: ['alertname = "TargetDown"', 'job = "cadvisor"']
    target_matchers: ['alertname =~ "Container.*"']

# ─────────────────────────────────────────────
# Receivers
# ─────────────────────────────────────────────
# With no integrations configured, alerts are still visible in the
# Alertmanager UI (http://localhost:9093) and in Grafana.
